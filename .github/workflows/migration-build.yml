name: Migration branch build

on:
  push:
    branches:
      - migration/postgresql
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recharge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recharge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/recharge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Test PostgreSQL schema migration on disposable database
        run: npm run db:migrate:postgres
