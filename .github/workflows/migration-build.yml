name: Migration branch build

on:
  push:
    branches:
      - migration/postgresql
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recharge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recharge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/recharge_test
      ADMIN_INITIAL_PASSWORD: ci-test-only-password
      JWT_SECRET: ci-test-only-jwt-secret-not-for-production
      NODE_ENV: test
      PORT: 5001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Commit synchronized lockfile on migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/postgresql'
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync PostgreSQL dependencies in lockfile"
            git push
          else
            echo "package-lock.json is already synchronized."
          fi
      - run: npm run build
      - name: Test PostgreSQL schema migration
        run: npm run db:migrate:postgres
      - name: Smoke-test API and admin login against disposable PostgreSQL
        shell: bash
        run: |
          npm run server > /tmp/recharge-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5001/api/health >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/recharge-server.log
              exit 1
            fi
            sleep 2
          done
          node --input-type=module <<'NODE'
          const base = 'http://127.0.0.1:5001';
          async function check(path, options = {}, expected = 200) {
            const response = await fetch(base + path, options);
            const body = await response.text();
            if (response.status !== expected) throw new Error(`${path}: expected HTTP ${expected}, got ${response.status}: ${body}`);
            return { response, body };
          }
          const health = await check('/api/health');
          if (!JSON.parse(health.body).status) throw new Error('Health response missing status');
          const providers = JSON.parse((await check('/api/providers')).body);
          if (!providers.success || !Array.isArray(providers.providers)) throw new Error('Providers response contract failed');
          const plans = JSON.parse((await check('/api/plans')).body);
          if (!plans.success || !Array.isArray(plans.plans)) throw new Error('Plans response contract failed');
          await check('/api/admin/stats/dashboard', {}, 401);
          const login = await check('/api/admin/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ identifier: 'admin', password: process.env.ADMIN_INITIAL_PASSWORD })
          });
          const loginData = JSON.parse(login.body);
          if (!loginData.success || !loginData.token) throw new Error('Admin login response contract failed');
          const me = JSON.parse((await check('/api/admin/me', {
            headers: { authorization: `Bearer ${loginData.token}` }
          })).body);
          if (!me.success || me.user?.username !== 'admin') throw new Error('Admin /me authentication failed');
          const stats = JSON.parse((await check('/api/admin/stats/dashboard', {
            headers: { authorization: `Bearer ${loginData.token}` }
          })).body);
          if (!stats.success) throw new Error('Admin dashboard response contract failed');
          const submissions = JSON.parse((await check('/api/admin/submissions?limit=10', {
            headers: { authorization: `Bearer ${loginData.token}` }
          })).body);
          if (!submissions.success || !Array.isArray(submissions.submissions)) throw new Error('Admin submissions response contract failed');
          console.log('API smoke tests passed: health, public providers/plans, auth protection, admin login/me/dashboard/submissions.');
          NODE
